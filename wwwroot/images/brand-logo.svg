<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 400" width="100%" height="100%">
  <defs>
    <!-- Sky Blue Gradient for Pen Nib -->
    <linearGradient id="exactNibGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Metallic Silver Gradient for Crescent Ring -->
    <linearGradient id="exactCrescentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A1A1AA" />
      <stop offset="100%" stop-color="#52525B" />
    </linearGradient>
  </defs>

  <!-- ================= EXACT STACKED VERTICAL ORIENTATION ================= -->
  
  <!-- 1. TOP: BIG PEN NIB & CRESCENT MOON RING -->
  <g transform="translate(225, 140)">
    <!-- Crescent Moon Ring -->
    <path d="M 14 -85 A 95 95 0 1 0 95 48 A 82 82 0 1 1 9 -66 Z" fill="url(#exactCrescentGrad)" />

    <!-- Pen Grip Base Top -->
    <path d="M 24 -80 L 62 -48 L 46 -28 L 8 -60 Z" fill="#71717A" />

    <!-- Fountain Pen Nib Body -->
    <path d="M 10 -58 L 52 -24 C 34 20 -10 62 -58 86 C -28 38 0 -10 10 -58 Z" fill="url(#exactNibGrad)" />

    <!-- Breather Hole & Slit Cutout -->
    <circle cx="-18" cy="24" r="9" fill="#0B0F17" />
    <line x1="-18" y1="24" x2="-54" y2="82" stroke="#0B0F17" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- 2. MIDDLE: अनलाइन् खबर पत्रिका (Sky Blue Text) -->
  <text x="225" y="315" text-anchor="middle" font-family="'Mukta', 'Devanagari', sans-serif" font-weight="800" font-size="40" fill="#38BDF8" letter-spacing="-0.5px">
    अनलाइन् खबर पत्रिका
  </text>

  <!-- 3. BOTTOM: — निष्पक्ष र निर्भीक समाचार — (Grey Text & Accents) -->
  <!-- Left Accent Line -->
  <line x1="40" y1="358" x2="85" y2="358" stroke="#71717A" stroke-width="2.5" />

  <!-- Sub-tagline -->
  <text x="225" y="366" text-anchor="middle" font-family="'Mukta', 'Devanagari', sans-serif" font-weight="600" font-size="22" fill="#A1A1AA" letter-spacing="0.5px">
    निष्पक्ष र निर्भीक समाचार
  </text>

  <!-- Right Accent Line -->
  <line x1="365" y1="358" x2="410" y2="358" stroke="#71717A" stroke-width="2.5" />
</svg>
