<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 95" width="100%" height="100%">
  <defs>
    <!-- Sky Blue Gradient for Pen Nib -->
    <linearGradient id="nibGradHoriz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Metallic Silver Gradient for Crescent Ring -->
    <linearGradient id="crescentGradHoriz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Drop Shadow / Glow for Logo -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .brand-title-np {
      font-family: 'Mukta', 'Devanagari', sans-serif;
      font-weight: 800;
      font-size: 36px;
    }
    .brand-tagline-np {
      font-family: 'Mukta', 'Devanagari', sans-serif;
      font-weight: 600;
      font-size: 15px;
      fill: #94A3B8;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- ================= LOGO ICON (LEFT ALIGNED) ================= -->
  <g transform="translate(48, 48)">
    <!-- Outer Crescent Ring -->
    <path d="M 9 -40 A 44 44 0 1 0 44 22 A 37 37 0 1 1 5 -31 Z" fill="url(#crescentGradHoriz)" />

    <!-- Pen Grip Base -->
    <path d="M 11 -37 L 29 -22 L 20 -13 L 2 -28 Z" fill="#64748B" />

    <!-- Fountain Pen Nib -->
    <path d="M 4 -26 L 24 -11 C 15 9 -4 29 -26 40 C -13 18 -1 -4 4 -26 Z" fill="url(#nibGradHoriz)" filter="url(#logoGlow)" />

    <!-- Breather Hole & Slit Cutout -->
    <circle cx="-9" cy="11" r="4.5" fill="#0B0F17" />
    <line x1="-9" y1="11" x2="-24" y2="37" stroke="#0B0F17" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- ================= BRAND TYPOGRAPHY ================= -->
  <!-- Main Title: अनलाइन् खबर पत्रिका -->
  <text x="110" y="52" class="brand-title-np">
    <tspan fill="#FFFFFF">अनलाइन् </tspan>
    <tspan fill="#38BDF8">खबर पत्रिका</tspan>
  </text>

  <!-- Divider Line Left -->
  <line x1="110" y1="74" x2="135" y2="74" stroke="#94A3B8" stroke-width="1.5" />
  
  <!-- Sub-tagline: निष्पक्ष र निर्भीक समाचार -->
  <text x="145" y="79" class="brand-tagline-np">निष्पक्ष र निर्भीक समाचार</text>

  <!-- Divider Line Right -->
  <line x1="315" y1="74" x2="340" y2="74" stroke="#94A3B8" stroke-width="1.5" />
</svg>
