name: Build and Auto-Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build & Publish Release
        run: dotnet publish -c Release -o ./publish

      - name: Copy Files to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "publish/*"
          target: "/tmp/onlinekhabarpatrika_update"
          strip_components: 1

      - name: Apply Updates & Restart Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo ">>> Synchronizing published files..."
            sudo rsync -av --exclude='*.db*' --exclude='wwwroot/uploads' /tmp/onlinekhabarpatrika_update/ /var/www/onlinekhabarpatrika/
            
            echo ">>> Fixing permissions..."
            sudo chown -R www-data:www-data /var/www/onlinekhabarpatrika
            sudo chmod -R 755 /var/www/onlinekhabarpatrika
            
            echo ">>> Restarting web service..."
            sudo systemctl restart onlinekhabarpatrika
            
            echo ">>> Cleaning up temporary release directory..."
            rm -rf /tmp/onlinekhabarpatrika_update
            
            echo ">>> Verifying service status..."
            sudo systemctl is-active --quiet onlinekhabarpatrika && echo "Service is RUNNING healthy!" || echo "Service failed to start"
