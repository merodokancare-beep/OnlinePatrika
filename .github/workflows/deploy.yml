name: Build and Auto-Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build & Publish Release
        run: dotnet publish -c Release -o ./publish

      - name: Deploy to Server via SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          RAW_HOST: ${{ secrets.SERVER_HOST }}
          RAW_USER: ${{ secrets.SERVER_USER }}
          RAW_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          # Clean inputs & defaults
          HOST=$(echo "$RAW_HOST" | tr -d '\r\n ' | sed -e 's|^https://||' -e 's|^http://||' -e 's|/$||')
          USER=$(echo "$RAW_USER" | tr -d '\r\n ')
          PORT=$(echo "$RAW_PORT" | tr -d '\r\n ')
          if [ -z "$PORT" ]; then PORT=22; fi
          if [ -z "$USER" ]; then USER="root"; fi

          echo ">>> Deploying to $USER@$HOST:$PORT"
          
          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          
          echo ">>> Adding host to known_hosts..."
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          
          echo ">>> Creating remote temp folder..."
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p "$PORT" "$USER@$HOST" "mkdir -p /tmp/onlinekhabarpatrika_update"
          
          echo ">>> Transferring updated release files to server..."
          rsync -avz -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no -p $PORT" --exclude='*.db*' --exclude='wwwroot/uploads' ./publish/ "$USER@$HOST:/tmp/onlinekhabarpatrika_update/"
          
          echo ">>> Applying release and restarting systemd service..."
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no -p "$PORT" "$USER@$HOST" << 'EOF'
            set -e
            echo ">>> Synchronizing files to /var/www/onlinekhabarpatrika..."
            sudo rsync -av --exclude='*.db*' --exclude='wwwroot/uploads' /tmp/onlinekhabarpatrika_update/ /var/www/onlinekhabarpatrika/
            
            echo ">>> Setting permissions..."
            sudo chown -R www-data:www-data /var/www/onlinekhabarpatrika
            sudo chmod -R 755 /var/www/onlinekhabarpatrika
            
            echo ">>> Restarting onlinekhabarpatrika service..."
            sudo systemctl restart onlinekhabarpatrika
            
            echo ">>> Cleaning temporary update files..."
            rm -rf /tmp/onlinekhabarpatrika_update
            
            echo ">>> Checking status:"
            sudo systemctl status onlinekhabarpatrika --no-pager
          EOF
          echo ">>> Deployment successful! 🚀"
